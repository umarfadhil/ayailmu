name: android-gate

# The CR-REL-2 gate. Runs on every push and PR. ubuntu-latest ships the Android SDK; Gradle caches via setup-gradle.
on:
  push:
    branches: [main]
    paths: ["android/**", "integration/verify-endpoint-isolation.py", "integration/tunnel/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android/**", "integration/verify-endpoint-isolation.py", "integration/tunnel/**", ".github/workflows/android.yml"]

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Pure-Kotlin modules (engine, content, model) + pack validation
        run: ./gradlew :core:model:test :core:engine:test :core:content:test :core:content:validatePacks --stacktrace

      - name: Data layer (Room on Robolectric), app unit tests, lint, debug build (demo flavor)
        run: ./gradlew :core:data:testDebugUnitTest :app:testDemoDebugUnitTest :app:lintDemoDebug :app:assembleDemoDebug --stacktrace

      - name: Sync contracts and synthetic account tests (live-provider fixtures run separately)
        run: ./gradlew :core:sync:test :app:testSyncLabDebugUnitTest --stacktrace

      - name: Unsigned production build and release lint
        run: ./gradlew :app:lintProdRelease :app:assembleProdRelease --stacktrace

      - name: Generated staging identity and callback isolation
        run: python3 ../integration/verify-endpoint-isolation.py

      - name: ktlint
        run: ./gradlew ktlintCheck

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ayailmu-demo-debug
          path: android/app/build/outputs/apk/demo/debug/*.apk
          retention-days: 7

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: android/app/build/reports/lint-results-demoDebug.html
          retention-days: 7
