name: android-play-license

# The eight Play public-key regressions run REAL `gradlew --offline` builds, so this job owns an isolated GRADLE_USER_HOME and warms
# it online first (wrapper distribution, plugins, dependencies) with the committed PUBLIC RSA fixture. No cache is restored: a cold
# cache is the normal case. No real Play key, secret, developer property or init script is involved. Run from the repository root.
# This is its own workflow (not a job in android.yml) so that the planned push of the integration ref starts it: android.yml only
# triggers on pushes to main and its gate job is unchanged. The ref below is the intended companion publication branch.
on:
  push:
    branches: [main, integration/ayailmu-infra-ci-20261025]
    paths: ["android/**", "infra/ci/**", ".github/workflows/android-play-license.yml"]
  pull_request:
    paths: ["android/**", "infra/ci/**", ".github/workflows/android-play-license.yml"]

permissions:
  contents: read

concurrency:
  group: android-play-license-${{ github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  play-license-offline:
    name: play-license-offline (8 real offline Gradle tests)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - name: Set the isolated task root and Gradle home (one home for warm-up and tests)
        run: |
          echo "AYA_CI_ROOT=$RUNNER_TEMP/aya-ci" >> "$GITHUB_ENV"
          echo "GRADLE_USER_HOME=$RUNNER_TEMP/aya-ci/gradle-home" >> "$GITHUB_ENV"

      # The default pull_request ref is a merge commit; check out the real head instead.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Log and verify the resolved source SHA
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          source_sha="$(git rev-parse HEAD)"
          [ "$source_sha" = "$EXPECTED_SHA" ] || { echo "source is $source_sha, expected $EXPECTED_SHA" >&2; exit 1; }
          echo "source: $source_sha"
          echo "### Resolved checkout: \`$source_sha\`" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Warm the isolated Gradle home online (public fixture key)
        run: sh android/tools/play-license-offline.sh warm

      - name: Eight Play public-key tests, Gradle --offline (same Gradle home)
        run: sh android/tools/play-license-offline.sh test
